<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure.Net – Data Management</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c1a4a;--navy2:#132663;--gold:#c9a24a;--gold2:#e8d29a;--maroon:#8e1b24;--bg:#f3f4f8;--card:#fff;--ink:#151a2e;--muted:#5b6382;--line:#dfe2ee;--ok:#19734a;--warn:#a85d00;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Hind,system-ui,sans-serif;font-size:15px;line-height:1.45}h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}button,input,select,textarea{font:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}[hidden]{display:none!important}
#login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}.brand{background:radial-gradient(circle at 30% 20%,var(--navy2),var(--navy));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:#fff;text-align:center;gap:18px}.brand img{width:min(340px,70%);border-radius:50%;box-shadow:0 0 0 6px rgba(201,162,74,.35)}.brand h1{font-size:2rem}.brand p{margin:0;max-width:34ch;color:var(--gold2)}.formwrap{display:flex;align-items:center;justify-content:center;padding:32px}form{width:100%;max-width:390px;display:flex;flex-direction:column;gap:14px}form h2{font-size:1.7rem}form .sub{color:var(--muted);margin:-7px 0 4px}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select,textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}textarea{min-height:90px;resize:vertical}.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px 14px;font-weight:700;cursor:pointer}.btn:hover{background:var(--navy2)}.btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--navy)}.btn.danger{background:var(--maroon)}.err{color:var(--maroon);font-weight:600;min-height:1.4em;margin:0}
#app{min-height:100%;display:flex;flex-direction:column}header{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 24px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}header .title{font-family:"Source Serif 4",Georgia,serif;font-size:1.3rem;font-weight:700}.post-logo{width:78px;height:78px;object-fit:cover;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(201,162,74,.65),0 4px 14px rgba(0,0,0,.28)}.brandhead{display:flex;align-items:center;gap:14px;min-width:0}.brandhead .title{white-space:nowrap}.brandhead .title small{margin-top:1px}.right{margin-left:auto}header .title small{display:block;font-family:Hind,sans-serif;font-weight:400;font-size:.78rem;color:var(--gold2)}header .right{display:flex;align-items:center;gap:12px}.who{text-align:right;line-height:1.25}.who small{color:var(--gold2)}.out{background:transparent;color:#fff;border:1.5px solid var(--gold);border-radius:7px;padding:6px 12px;cursor:pointer}header img{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold)}
.layout{flex:1;display:grid;grid-template-columns:235px 1fr}nav{background:var(--card);border-right:1px solid var(--line);padding:15px 10px;display:flex;flex-direction:column;gap:3px}nav button{text-align:left;background:none;border:0;border-radius:7px;padding:10px 12px;color:var(--ink);cursor:pointer}nav button:hover{background:var(--bg)}nav button[aria-current=page]{background:var(--navy);color:#fff}main{padding:26px;overflow:auto}main h2{font-size:1.65rem;margin-bottom:4px}.lead{color:var(--muted);margin:0 0 20px;max-width:85ch}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.toolbar input,.toolbar select{min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}.tile,.panel{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);padding:15px;border-radius:6px}.tile h3{font-size:1.05rem;margin-bottom:4px}.tile p{margin:0;color:var(--muted);font-size:.92rem}.stat{font-size:1.8rem;font-weight:800;margin:2px 0}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:700;background:#edf0f7}.badge.ok{color:var(--ok);background:#e6f5ed}.badge.warn{color:var(--warn);background:#fff0dc}.badge.red{color:var(--maroon);background:#fde8ea}.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--bg);font-weight:700}tr:last-child td{border-bottom:0}.link{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline}.empty{padding:28px;text-align:center;color:var(--muted)}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--navy)}.timeline{border-left:3px solid var(--gold);padding-left:16px;margin:10px 0}.event{margin:0 0 15px;position:relative}.event:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--navy)}.event strong{display:block}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 8px;border:1px solid var(--line);border-radius:99px;background:var(--bg)}.notice{padding:10px 12px;border-radius:7px;background:#eef3ff;border:1px solid #cbd7ff;margin:12px 0}.modal{position:fixed;inset:0;background:rgba(4,10,30,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:var(--card);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:10px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:transparent;font-size:1.5rem;cursor:pointer}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi .panel{border-left:0;border-top:4px solid var(--gold)}.mini{font-size:.82rem}.hash{font-family:ui-monospace,monospace;font-size:.78rem;word-break:break-all}
@media(max-width:760px){.post-logo{width:58px;height:58px}.brandhead{gap:9px}.brandhead .title{font-size:1.05rem}#login{grid-template-columns:1fr}.brand{padding:24px}.brand img{width:150px}.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap}header{padding:8px 12px}.who{display:none}main{padding:18px}.kpi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function dashboard(){let open=db.cases.filter(c=>c.status!=='Court Prep').length;let recent=db.audit.slice(0,5);shell('Welcome, '+session.role,'Connected demo environment. Actions are saved through the Secure.Net backend and database.',`<div class="kpi">${stat('Active cases',open,'Across all demo investigations')}${stat('Documents',db.docs.length,'Versioned records')}${stat('High priority',db.cases.filter(c=>c.priority==='High').length,'Needs attention')}${stat('Audit events',db.audit.length,'Most recent first')}</div><div class="grid" style="margin-top:14px"><div class="tile"><h3>Recent cases</h3>${db.cases.slice(0,3).map(c=>`<p style="margin:8px 0"><span class="link" data-case="${c.id}">${esc(c.id)}</span> — ${esc(c.title)} <span class="badge ${c.priority==='High'?'red':''}">${esc(c.priority)}</span></p>`).join('')}</div><div class="tile"><h3>System activity</h3>${recent.map(a=>`<p class="mini"><b>${esc(a.action)}</b> · ${esc(a.target)}<br><span class="muted">${esc(a.time)}</span></p>`).join('')}</div></div>`);document.querySelectorAll('[data-case]').forEach(x=>x.onclick=()=>caseDetail(x.dataset.case))}
function cases(){shell('Cases','Manage the investigation workspace and open a case for linked records.',`<div class="toolbar"><input id="caseFilter" placeholder="Filter cases…"><button class="btn" id="newCase">+ New case</button></div><div class="tablewrap"><table><thead><tr><th>Case</th><th>FIR</th><th>Officer</th><th>Status</th><th>Priority</th><th>Updated</th><th></th></tr></thead><tbody id="caseRows"></tbody></table></div>`);renderCases();$('caseFilter').oninput=renderCases;$('newCase').onclick=()=>newCase()}
function renderCases(){let q=($('caseFilter')?.value||'').toLowerCase();let rows=db.cases.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q));$('caseRows').innerHTML=rows.map(c=>`<tr><td><span class="link" data-case="${c.id}">${esc(c.id)}</span><br>${esc(c.title)}</td><td>${esc(c.fir)}</td><td>${esc(c.officer)}</td><td><span class="badge">${esc(c.status)}</span></td><td><span class="badge ${c.priority==='High'?'red':''}">${esc(c.priority)}</span></td><td>${esc(c.updated)}</td><td><button class="btn secondary" data-case="${c.id}">Open</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No matching cases.</td></tr>`;document.querySelectorAll('[data-case]').forEach(x=>x.onclick=()=>caseDetail(x.dataset.case))}
function caseDetail(id){let c=db.cases.find(x=>x.id===id);if(!c)return;let docs=db.docs.filter(d=>d.case===id);active='Cases';shell(c.id,`${c.title} · ${c.fir}`,`<div class="toolbar"><button class="btn secondary" id="backCases">← Back</button><button class="btn" id="addDoc">Upload mock document</button><button class="btn" id="bundleCase">Create court bundle</button></div><div class="grid"><div class="panel"><h3>Case details</h3><p><b>Officer:</b> ${esc(c.officer)}</p><p><b>Status:</b> ${esc(c.status)}</p><p><b>Priority:</b> ${esc(c.priority)}</p><p><b>Last updated:</b> ${esc(c.updated)}</p><div class="chips">${c.tags.map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}</div></div><div class="panel"><h3>People & places</h3><p><b>People</b><br>${c.people.map(x=>esc(x)).join(', ')}</p><p><b>Places</b><br>${c.places.map(x=>esc(x)).join(', ')}</p></div></div><div class="panel" style="margin-top:14px"><h3>Linked documents (${docs.length})</h3>${docs.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>Version</th><th>Pages</th><th>Hash</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td>v${d.version}</td><td>${d.pages}</td><td class="hash">${esc(d.hash)}</td><td><button class="btn secondary" data-doc="${d.id}">View</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No documents linked.</div>'}</div>`);$('backCases').onclick=cases;$('addDoc').onclick=()=>mockUpload(id);$('bundleCase').onclick=()=>bundle(id);document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>docDetail(b.dataset.doc));audit('Opened case',id)}
function documents(){shell('Documents','Versioned document registry backed by the Secure.Net API; upload, version and hash actions are persisted.',`<div class="toolbar"><input id="docFilter" placeholder="Search documents…"><button class="btn" id="uploadDoc">+ Upload document</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Document</th><th>Case</th><th>Type</th><th>Version</th><th>Date</th><th></th></tr></thead><tbody id="docRows"></tbody></table></div>`);renderDocs();$('docFilter').oninput=renderDocs;$('uploadDoc').onclick=()=>mockUpload(db.cases[0].id)}
function renderDocs(){let q=($('docFilter')?.value||'').toLowerCase();let rows=db.docs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(q));$('docRows').innerHTML=rows.map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.name)}</b><br><span class="muted mini">${d.pages} pages</span></td><td>${esc(d.case)}</td><td>${esc(d.type)}</td><td>v${d.version}</td><td>${esc(d.date)}</td><td><button class="btn secondary" data-doc="${d.id}">Open</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No documents found.</td></tr>';document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>docDetail(b.dataset.doc))}
function docDetail(id){let d=db.docs.find(x=>x.id===id);if(!d)return;modal(`<div class="modalhead"><h3>${esc(d.name)}</h3><button class="close" data-close>×</button></div><p><b>Document ID:</b> ${esc(d.id)}<br><b>Case:</b> ${esc(d.case)}<br><b>Type:</b> ${esc(d.type)}<br><b>Version:</b> v${d.version}<br><b>Pages:</b> ${d.pages}<br><b>Hash:</b> <span class="hash">${esc(d.hash)}</span></p><div class="notice">Demo preview: this record represents a securely stored document. No real file is uploaded to a server.</div><div class="toolbar"><button class="btn" id="verifyDoc">Verify hash</button><button class="btn secondary" id="newVersion">Create new version</button></div>`);$('verifyDoc').onclick=()=>{audit('Hash verified',id);alert('Hash verified: MATCH\nDemo integrity check passed.');closeModal()};$('newVersion').onclick=()=>{d.version++;d.hash=Math.random().toString(16).slice(2,10)+'…'+Math.random().toString(16).slice(2,6);save();audit('Created document version',id);closeModal();documents()}}
function search(){shell('Search','Search mock records by case, FIR number, person, date, document name or tag.',`<div class="toolbar"><input id="globalSearch" style="flex:1" placeholder="e.g. FIR/2026/0412, Rohan Mehta, CCTV…"><button class="btn" id="runSearch">Search</button></div><div id="searchResults"></div>`);$('runSearch').onclick=runSearch;$('globalSearch').onkeydown=e=>{if(e.key==='Enter')runSearch()}}
function runSearch(){let q=$('globalSearch').value.trim().toLowerCase();if(!q){$('searchResults').innerHTML='<div class="empty">Enter a search term.</div>';return}let cs=db.cases.filter(c=>Object.values(c).flat().join(' ').toLowerCase().includes(q));let ds=db.docs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(q));audit('Search executed',q);$('searchResults').innerHTML=`<div class="grid"><div class="panel"><h3>Cases (${cs.length})</h3>${cs.map(c=>`<p><span class="link" data-case="${c.id}">${esc(c.id)}</span> — ${esc(c.title)}</p>`).join('')||'<p class="muted">No cases.</p>'}</div><div class="panel"><h3>Documents (${ds.length})</h3>${ds.map(d=>`<p><span class="link" data-doc="${d.id}">${esc(d.name)}</span> — ${esc(d.case)}</p>`).join('')||'<p class="muted">No documents.</p>'}</div></div>`;document.querySelectorAll('[data-case]').forEach(x=>x.onclick=()=>caseDetail(x.dataset.case));document.querySelectorAll('[data-doc]').forEach(x=>x.onclick=()=>docDetail(x.dataset.doc))}
function ai(){shell('AI Case Assistant','Mock assistant for the prototype. It answers only from seeded case records and labels the source used.',`<div class="toolbar"><select id="aiCase">${db.cases.map(c=>`<option value="${c.id}">${esc(c.id)} — ${esc(c.title)}</option>`).join('')}</select></div><div class="panel"><label>Question<textarea id="aiQ" placeholder="What documents are linked to this case?"></textarea></label><button class="btn" id="askAi">Ask assistant</button><div id="aiAnswer" style="margin-top:14px"></div></div>`);$('askAi').onclick=askAI}
function askAI(){let c=db.cases.find(x=>x.id===$('aiCase').value),q=$('aiQ').value.trim().toLowerCase(),ds=db.docs.filter(d=>d.case===c.id),ans='';if(!q)ans='Please enter a question.';else if(q.includes('document'))ans=`${c.id} has ${ds.length} linked document(s): ${ds.map(d=>d.name).join(', ')}.`;else if(q.includes('people')||q.includes('person'))ans=`People recorded for this case: ${c.people.join(', ')}.`;else if(q.includes('place')||q.includes('where'))ans=`Recorded places: ${c.places.join(', ')}.`;else if(q.includes('status'))ans=`Current status is ${c.status}, priority ${c.priority}.`;else ans=`Demo answer: I found the case ${c.id} (${c.title}) and ${ds.length} linked document(s). Ask about documents, people, places, or status for a sourced response.`;$('aiAnswer').innerHTML=`<div class="notice"><b>Assistant:</b> ${esc(ans)}<br><span class="mini muted">Source: case record ${esc(c.id)}${ds[0]?' and document registry':''}. Demo retrieval only.</span></div>`;audit('AI question',c.id)}
function timeline(){let c=db.cases[0];shell('Timeline and Graph','Explore mock people, places and events associated with a case. Mismatches are explicitly flagged.',`<div class="toolbar"><select id="tlCase">${db.cases.map(x=>`<option value="${x.id}">${esc(x.id)} — ${esc(x.title)}</option>`).join('')}</select></div><div id="tlOut"></div>`);$('tlCase').onchange=renderTimeline;renderTimeline()}
function renderTimeline(){let c=db.cases.find(x=>x.id===$('tlCase').value);let events=[['12 Aug 2026','CCTV footage logged','MIDC Road','Evidence'],['14 Aug 2026','Witness statement recorded','Andheri East','Statement'],['18 Aug 2026','Vehicle number added to case','Andheri East','Lead'],['29 Sep 2026','CCTV file integrity checked','Secure.Net','Verification']];$('tlOut').innerHTML=`<div class="grid"><div class="panel"><h3>Timeline</h3><div class="timeline">${events.map(e=>`<div class="event"><strong>${e[0]} · ${e[1]}</strong><span class="muted">${e[2]} · ${e[3]}</span></div>`).join('')}</div></div><div class="panel"><h3>Relationship graph</h3><p><b>${esc(c.people[0])}</b> → statement → <b>${esc(c.id)}</b></p><p><b>${esc(c.people[1]||'Officer')}</b> → investigation → <b>${esc(c.places[0])}</b></p><p><b>${esc(c.id)}</b> → evidence → <b>${esc(db.docs.find(d=>d.case===c.id)?.name||'No evidence')}</b></p><div class="notice"><b>Flag:</b> One witness timestamp is marked for review in the demo because it differs from the event timeline by 1 day.</div></div></div>`}
function completeness(){shell('Completeness Checker','Compare each case against the demo checklist and identify missing document categories.',`<div class="grid">${db.cases.map(c=>{let types=new Set(db.docs.filter(d=>d.case===c.id).map(d=>d.type));let req=['FIR','Statement','Evidence','Report'];let have=req.filter(x=>types.has(x)).length;return `<div class="panel"><div class="row"><h3>${esc(c.id)}</h3><span class="badge ${have===4?'ok':'warn'}">${have}/4</span></div><p>${esc(c.title)}</p><div class="progress"><i style="width:${have/4*100}%"></i></div><p class="mini muted">Missing: ${req.filter(x=>!types.has(x)).join(', ')||'None'}</p><button class="btn secondary" data-case="${c.id}">Open case</button></div>`}).join('')}</div>`);document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>caseDetail(b.dataset.case))}
function bundle(id){let c=db.cases.find(x=>x.id===id);let ds=db.docs.filter(d=>d.case===id);audit('Court bundle generated',id);modal(`<div class="modalhead"><h3>Court Bundle — ${esc(c.id)}</h3><button class="close" data-close>×</button></div><p><b>Indexed documents:</b> ${ds.length}<br><b>Total pages:</b> ${ds.reduce((a,d)=>a+d.pages,0)}<br><b>Generated:</b> ${new Date().toLocaleString('en-IN')}</p><div class="panel"><h3>Index</h3>${ds.map((d,i)=>`<p>${i+1}. ${esc(d.name)} — ${d.pages} pages — hash ${esc(d.hash)}</p>`).join('')}</div><div class="notice"><b>Integrity certificate:</b> DEMO-${Math.random().toString(36).slice(2,10).toUpperCase()}<br>This prototype simulates certificate generation; it is not a legal certificate.</div><button class="btn" id="downloadBundle">Download demo index</button>`);$('downloadBundle').onclick=()=>{let text='Secure.Net Demo Court Bundle\n'+c.id+'\n\n'+ds.map((d,i)=>`${i+1}. ${d.name} | ${d.pages} pages | ${d.hash}`).join('\n');downloadText('court-bundle-'+id+'.txt',text)}}
function court(){shell('Court Bundle','Create a page-indexed bundle from a case and simulate an integrity certificate.',`<div class="grid">${db.cases.map(c=>`<div class="tile"><h3>${esc(c.id)}</h3><p>${esc(c.title)}</p><button class="btn" data-bundle="${c.id}" style="margin-top:10px">Build bundle</button></div>`).join('')}</div>`);document.querySelectorAll('[data-bundle]').forEach(b=>b.onclick=()=>bundle(b.dataset.bundle))}
function verify(){shell('Verify and Leak Trace','Use the demo hash registry to verify integrity or trace a simulated leaked copy.',`<div class="grid"><div class="panel"><h3>Hash verification</h3><select id="verifyDoc">${db.docs.map(d=>`<option value="${d.id}">${esc(d.name)} (${d.id})</option>`).join('')}</select><button class="btn" id="verifyBtn" style="margin-top:10px">Verify file</button><div id="verifyOut"></div></div><div class="panel"><h3>Leak trace</h3><select id="leakDoc">${db.docs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><select id="copyMark" style="margin-top:8px"><option>Copy A — Court Review</option><option>Copy B — Evidence Room</option><option>Copy C — External Review</option></select><button class="btn" id="traceBtn" style="margin-top:10px">Trace copy</button><div id="traceOut"></div></div></div>`);$('verifyBtn').onclick=()=>{let d=db.docs.find(x=>x.id===$('verifyDoc').value);audit('Hash verified',d.id);$('verifyOut').innerHTML=`<div class="notice"><b>MATCH</b> — ${esc(d.name)} matches the demo registry hash <span class="hash">${esc(d.hash)}</span>.</div>`};$('traceBtn').onclick=()=>{let d=db.docs.find(x=>x.id===$('leakDoc').value),m=$('copyMark').value;audit('Leak trace',d.id);$('traceOut').innerHTML=`<div class="notice"><b>Trace result:</b> ${esc(m)} is the registered demo copy for ${esc(d.name)}.<br><span class="muted mini">Real deployments would use watermark/provenance metadata.</span></div>`}}
function auditPage(){shell('Audit Log','Every action is recorded by the Secure.Net backend in a chronological activity trail.',`<div class="toolbar"><button class="btn secondary" id="exportAudit">Export audit log</button><button class="btn danger" id="clearAudit">Clear demo audit</button></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td><span class="badge ok">${esc(a.result)}</span></td></tr>`).join('')}</tbody></table></div>`);$('exportAudit').onclick=()=>downloadText('secure-net-audit.json',JSON.stringify(db.audit,null,2));$('clearAudit').onclick=()=>{if(confirm('Clear the demo audit trail?')){db.audit=[];save();audit('Audit reset','System');auditPage()}}}
function users(){if(session.role!=='Admin')return dashboard();shell('Users and Roles','Manage demo users and role assignments.',`<div class="toolbar"><button class="btn" id="addUser">+ Add user</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><span class="badge ok">${esc(u.status)}</span></td><td><button class="btn secondary" data-user="${u.id}">Toggle status</button></td></tr>`).join('')}</tbody></table></div>`);$('addUser').onclick=()=>{let id=prompt('New user ID');if(!id)return;let name=prompt('Display name','New Officer')||'New Officer';db.users.push({id,name,role:'Investigating Officer',status:'Active'});save();audit('Created user',id);users()};document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{let u=db.users.find(x=>x.id===b.dataset.user);u.status=u.status==='Active'?'Disabled':'Active';save();audit('Changed user status',u.id);users()})}
function show(name){active=name;if(name==='Dashboard')dashboard();else if(name==='Cases')cases();else if(name==='Documents')documents();else if(name==='Search')search();else if(name==='AI Case Assistant')ai();else if(name==='Timeline and Graph')timeline();else if(name==='Completeness Checker')completeness();else if(name==='Court Bundle')court();else if(name==='Verify and Leak Trace')verify();else if(name==='Audit Log')auditPage();else if(name==='Users and Roles')users()}
function newCase(){modal(`<div class="modalhead"><h3>Create mock case</h3><button class="close" data-close>×</button></div><label>Case title<input id="ncTitle" value="New Investigation"></label><label>FIR number<input id="ncFir" value="FIR/2026/0500"></label><label>Officer<input id="ncOfficer" value="A. Sharma"></label><label>Priority<select id="ncPriority"><option>Medium</option><option>High</option><option>Low</option></select></label><button class="btn" id="saveCase" style="margin-top:12px">Create case</button>`);$('saveCase').onclick=()=>{let id='SN-2026-'+String(Math.floor(1000+Math.random()*9000));db.cases.unshift({id,title:$('ncTitle').value,fir:$('ncFir').value,officer:$('ncOfficer').value,status:'Open',priority:$('ncPriority').value,updated:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),people:[$('ncOfficer').value],places:['Mumbai'],tags:['new']});save();audit('Created case',id);closeModal();cases()}}
function mockUpload(caseId){modal(`<div class="modalhead"><h3>Upload mock document</h3><button class="close" data-close>×</button></div><label>Document name<input id="upName" value="New_Evidence.pdf"></label><label>Type<select id="upType"><option>Evidence</option><option>Statement</option><option>Report</option><option>FIR</option><option>Memo</option></select></label><label>Pages<input id="upPages" type="number" min="1" value="4"></label><button class="btn" id="saveDoc" style="margin-top:12px">Add document</button>`);$('saveDoc').onclick=()=>{let id='DOC-'+Math.floor(1000+Math.random()*8999);db.docs.unshift({id,case:caseId,name:$('upName').value,type:$('upType').value,pages:+$('upPages').value||1,version:1,hash:Math.random().toString(16).slice(2,10)+'…'+Math.random().toString(16).slice(2,6),date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),owner:session.id});save();audit('Uploaded document',id);closeModal();active==='Documents'?documents():caseDetail(caseId)}}
function modal(html){let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modalbox">${html}</div>`;document.body.appendChild(m);m.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('modal')?.remove()}function downloadText(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('uid').value.trim(),pw=$('pwd').value;if(id!=='admin'||pw!=='admin'){ $('err').textContent='Invalid credentials. Demo login is admin / admin.';$('pwd').value='';$('pwd').focus();return } $('err').textContent='Connecting to Secure.Net backend…'; try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({id,password:pw,role:$('role').value})});apiToken=r.token;localStorage.setItem('securenet_api_token',apiToken);session=r.user;const state=await api('/api/state');if(state.data.cases?.length){db=state.data}else{db=seed;await api('/api/state',{method:'PUT',body:JSON.stringify(db)})}localStorage.setItem(KEY,JSON.stringify(db));$('err').textContent='';$('whoRole').textContent=session.role;$('whoId').textContent='ID: '+session.id;$('login').hidden=true;$('app').hidden=false;show('Dashboard')}catch(err){$('err').textContent='Backend connection failed: '+err.message}});$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){} apiToken='';localStorage.removeItem('securenet_api_token');session=null;$('app').hidden=true;$('login').hidden=false;$('uid').value='';$('pwd').value='';$('uid').focus()};
})();
</script>
</body>
</html>
